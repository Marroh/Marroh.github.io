name: Publish homepage
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          mkdir site
          cp -R assets index.html app.js content.js style.css site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: publish
        uses: actions/deploy-pages@v4
